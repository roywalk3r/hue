<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hue Stream</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #121212; color: #e0e0e0; font-family: 'Segoe UI', system-ui, sans-serif; }
        .card { background-color: #1e1e1e; border: none; transition: transform 0.2s; }
        .card:hover { transform: scale(1.03); z-index: 10; }
        .nav-tabs .nav-link { color: #aaa; border: none; }
        .nav-tabs .nav-link.active { background-color: #1e1e1e; color: #fff; border-bottom: 2px solid #0d6efd; }
        .btn-primary { background-color: #0d6efd; border: none; }
        .poster { height: 300px; object-fit: cover; width: 100%; border-radius: 4px; }
        #results { min-height: 400px; }
        .badge-quality { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.7); }
        .spinner-border { width: 3rem; height: 3rem; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">Hue Stream</a>
            <div class="ms-auto">
                <a href="/api/docs" class="btn btn-outline-light btn-sm me-2">API Docs</a>
                <a href="/api/metrics" class="btn btn-outline-info btn-sm">Metrics</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <ul class="nav nav-tabs mb-4" id="searchTabs">
            <li class="nav-item"><button class="nav-link active" data-source="hitv">Discovery (KDrama)</button></li>
            <li class="nav-item"><button class="nav-link" data-source="tmdb">Movies & TV (ID)</button></li>
            <li class="nav-item"><button class="nav-link" data-source="kisskh">KissKH</button></li>
            <li class="nav-item"><button class="nav-link" data-source="dramacool">Dramacool</button></li>
        </ul>

        <div class="input-group mb-4" id="searchGroup">
            <input type="text" id="searchInput" class="form-control form-control-lg bg-dark text-light border-secondary" placeholder="Discover KDramas or enter Title/ID...">
            <button class="btn btn-primary" id="searchBtn">Search / Browse</button>
        </div>

        <div id="filterBar" class="mb-4 d-flex gap-2 flex-wrap">
            <select id="genreFilter" class="form-select bg-dark text-light border-secondary w-auto">
                <option value="All">All Genres</option>
            </select>
            <select id="sortFilter" class="form-select bg-dark text-light border-secondary w-auto">
                <option value="Hottest">Hottest</option>
                <option value="Newest">Newest</option>
                <option value="Recommend">Trending</option>
            </select>
        </div>

        <div id="loading" class="text-center my-5 d-none">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="mt-2 text-muted">Searching...</p>
        </div>

        <div id="results" class="row g-4"></div>
    </div>

    <!-- Stream Modal -->
    <div class="modal fade" id="streamModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content bg-dark">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title">Streams Found</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="modalLoading" class="text-center d-none"><div class="spinner-border text-light"></div></div>
                    <div id="streamList" class="list-group"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentSource = 'hitv';
        const resultsDiv = document.getElementById('results');
        const loadingDiv = document.getElementById('loading');

        // Fetch Genres on Load
        async function loadMetadata() {
            try {
                const res = await fetch('/api/hitv/genres');
                const genres = await res.json();
                const select = document.getElementById('genreFilter');
                genres.forEach(g => {
                    if(g === 'All') return;
                    const opt = document.createElement('option');
                    opt.value = g;
                    opt.textContent = g;
                    select.appendChild(opt);
                });
            } catch(e) {}
        }
        loadMetadata();

        document.querySelectorAll('#searchTabs button').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelector('#searchTabs .active').classList.remove('active');
                e.target.classList.add('active');
                currentSource = e.target.dataset.source;
                document.getElementById('filterBar').classList.toggle('d-none', currentSource !== 'hitv');
                resultsDiv.innerHTML = ''; 
                if(currentSource === 'hitv') performSearch(); // Auto-browse on tab switch
            });
        });

        // Initial browse
        performSearch();

        document.getElementById('searchBtn').addEventListener('click', performSearch);
        document.getElementById('searchInput').addEventListener('keypress', (e) => e.key === 'Enter' && performSearch());

        async function performSearch() {
            const q = document.getElementById('searchInput').value;
            loadingDiv.classList.remove('d-none');
            resultsDiv.innerHTML = '';

            try {
                let items = [];
                if (currentSource === 'hitv') {
                    if (q) {
                        const res = await fetch(`/api/hitv/search?q=${encodeURIComponent(q)}`);
                        const data = await res.json();
                        items = data.items || [];
                    } else {
                        const genre = document.getElementById('genreFilter').value;
                        const sort = document.getElementById('sortFilter').value;
                        const res = await fetch(`/api/hitv/browse?genre=${genre}&sort=${sort}&pageSize=28`);
                        const data = await res.json();
                        items = data.items || [];
                    }
                } else if (currentSource === 'tmdb') {
                    if(!isNaN(q) && q.length > 0) { 
                         loadStreams(q, 'TMDB Content');
                         loadingDiv.classList.add('d-none');
                         return;
                    }
                    alert('Please enter a TMDB ID (e.g. 1434 for Family Guy)');
                    loadingDiv.classList.add('d-none');
                    return;
                } else if (currentSource === 'kisskh') {
                    const res = await fetch(`/api/kdrama/search?q=${encodeURIComponent(q)}`);
                    const data = await res.json();
                    items = data.results || [];
                } else if (currentSource === 'dramacool') {
                    const res = await fetch(`/api/dramacool/search?q=${encodeURIComponent(q)}`);
                    const data = await res.json();
                    items = data.data || [];
                }

                renderResults(items);
            } catch (e) {
                console.error(e);
                resultsDiv.innerHTML = '<div class="text-center text-danger">Error fetching results</div>';
            } finally {
                loadingDiv.classList.add('d-none');
            }
        }

        function renderResults(items) {
            if (items.length === 0) {
                resultsDiv.innerHTML = '<p class="text-center text-muted">No results found.</p>';
                return;
            }

            resultsDiv.innerHTML = items.map(item => `
                <div class="col-6 col-md-4 col-lg-3">
                    <div class="card h-100 cursor-pointer" onclick="loadStreams('${item.id}', '${item.title.replace(/'/g, "")}')">
                        <img src="${item.cover || item.thumbnail || item.image || 'https://via.placeholder.com/300x450?text=No+Image'}" class="poster card-img-top" alt="${item.title}">
                        <div class="card-body p-2">
                            <h6 class="card-title text-truncate small mb-0">${item.title}</h6>
                            <div class="d-flex justify-content-between align-items-center mt-1">
                                <small class="text-muted">${item.rating || ''} ⭐</small>
                                <small class="text-muted" style="font-size: 0.7rem;">${item.releaseDate ? item.releaseDate.split('-')[0] : ''}</small>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        window.loadStreams = async (id, title) => {
            const modal = new bootstrap.Modal(document.getElementById('streamModal'));
            modal.show();
            
            const list = document.getElementById('streamList');
            const loader = document.getElementById('modalLoading');
            const modalTitle = document.querySelector('.modal-title');
            list.innerHTML = '';
            loader.classList.remove('d-none');
            modalTitle.textContent = `Streams for ${title}`;

            try {
                // Default to episode 1 for demo
                const ep = prompt(`Enter Episode Number for "${title}"`, "1") || 1;
                
                let url;
                if (currentSource === 'hitv') url = `/api/hitv/play/${id}/${ep}?title=${encodeURIComponent(title)}`;
                else if (currentSource === 'tmdb') url = `/api/streams/series/${id}?season=1&episode=${ep}`;
                else if (currentSource === 'kisskh') url = `/api/kdrama/streams/${id}/${ep}`;
                else if (currentSource === 'dramacool') url = `/api/dramacool/browse/streams/${id}/${ep}`;

                const res = await fetch(url);
                const data = await res.json();

                loader.classList.add('d-none');
                
                if (!data.streams || data.streams.length === 0) {
                    list.innerHTML = '<div class="alert alert-warning">No streams found. Try another source or check logs.</div>';
                    return;
                }

                list.innerHTML = data.streams.map(s => `
                    <a href="${s.url}" target="_blank" class="list-group-item list-group-item-action bg-dark text-light border-secondary mb-2 rounded">
                        <div class="d-flex w-100 justify-content-between align-items-center">
                            <h6 class="mb-1 text-primary">${s.provider || 'Unknown'}</h6>
                            <span class="badge bg-secondary">${s.quality || 'Auto'}</span>
                        </div>
                        <p class="mb-1 text-truncate small text-muted">${s.url}</p>
                        <div class="mt-2">
                            ${s.subtitles ? `<span class="badge bg-info me-1">${s.subtitles.length} Subtitles</span>` : ''}
                            <small class="text-success fw-bold">▶️ Play Stream</small>
                        </div>
                    </a>
                `).join('');

            } catch (e) {
                loader.classList.add('d-none');
                list.innerHTML = `<div class="alert alert-danger">Error: ${e.message}</div>`;
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
