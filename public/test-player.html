<!DOCTYPE html>
<html>
<head>
    <title>M3U8 Proxy Test Player</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest/dist/hls.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            background: #000; 
            color: #fff; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .container { 
            max-width: 1200px; 
            margin: 0 auto; 
            padding: 20px;
            width: 100%;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 2em;
            margin-bottom: 10px;
            color: #dc2626;
        }
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .url-input {
            flex: 1;
            min-width: 300px;
            background: #1a1a1a;
            color: #fff;
            border: 1px solid #333;
            padding: 10px;
            border-radius: 5px;
            font-size: 14px;
        }
        .btn {
            background: #dc2626;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }
        .btn:hover { background: #b91c1c; }
        .btn:disabled { background: #666; cursor: not-allowed; }
        .video-container {
            position: relative;
            background: #111;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        #video { 
            width: 100%; 
            display: block;
        }
        .stats {
            background: #111;
            padding: 15px;
            border-radius: 10px;
            font-family: monospace;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .stats .good { color: #4ade80; }
        .stats .warning { color: #fbbf24; }
        .stats .error { color: #ef4444; }
        .logs {
            background: #0a0a0a;
            padding: 15px;
            border-radius: 10px;
            font-family: monospace;
            font-size: 12px;
            max-height: 200px;
            overflow-y: auto;
        }
        .log-line {
            margin-bottom: 5px;
            padding: 2px 0;
        }
        .log-info { color: #60a5fa; }
        .log-error { color: #ef4444; }
        .log-success { color: #4ade80; }
        .preset-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        .preset-btn {
            background: #333;
            color: #fff;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            transition: background 0.2s;
        }
        .preset-btn:hover { background: #444; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎺 M3U8 Proxy Test Player</h1>
            <p>Test streams from your proxy server</p>
        </div>
        
        <div class="preset-buttons">
            <button class="preset-btn" onclick="loadPreset('http://localhost:6000/pl_sun/tracks-v1a1/mono.ts.m3u8')">Track 1a1</button>
            <button class="preset-btn" onclick="loadPreset('http://localhost:6000/pl_sun/tracks-v2a1/mono.ts.m3u8')">Track 2a1</button>
            <button class="preset-btn" onclick="loadPreset('http://localhost:6000/pl_sun/tracks-v3a1/mono.ts.m3u8')">Track 3a1</button>
            <button class="preset-btn" onclick="loadPreset('http://localhost:6001/pl_sun/tracks-v1a1/mono.ts.m3u8')">Sports Proxy 6001</button>
            <button class="preset-btn" onclick="loadPreset('https://m3u8.testpjmail.workers.dev/pl_sun/tracks-v1a1/mono.ts.m3u8')">Cloudflare Worker</button>
        </div>
        
        <div class="controls">
            <input type="text" 
                   id="streamUrl" 
                   class="url-input" 
                   placeholder="Enter M3U8 URL (e.g., http://localhost:6000/pl_sun/tracks-v1a1/mono.ts.m3u8)"
                   value="http://localhost:6000/pl_sun/tracks-v1a1/mono.ts.m3u8">
            <button id="loadBtn" class="btn">Load Stream</button>
            <button id="muteBtn" class="btn">Mute</button>
            <button id="fullscreenBtn" class="btn">Fullscreen</button>
            <button id="clearLogsBtn" class="btn">Clear Logs</button>
        </div>
        
        <div class="video-container">
            <video id="video" controls muted></video>
        </div>
        
        <div class="stats" id="stats">
            Ready to load stream...
        </div>
        
        <div class="logs" id="logs">
            <div class="log-line log-info">Player initialized. HLS.js version: <script>document.write(Hls.version);</script></div>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const stats = document.getElementById('stats');
        const logs = document.getElementById('logs');
        const loadBtn = document.getElementById('loadBtn');
        const muteBtn = document.getElementById('muteBtn');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const clearLogsBtn = document.getElementById('clearLogsBtn');
        const streamUrl = document.getElementById('streamUrl');
        
        let hls;
        let bufferCount = 0;
        let isPlaying = false;
        
        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const logLine = document.createElement('div');
            logLine.className = `log-line log-${type}`;
            logLine.textContent = `[${timestamp}] ${message}`;
            logs.appendChild(logLine);
            logs.scrollTop = logs.scrollHeight;
            
            // Keep only last 50 logs
            while (logs.children.length > 50) {
                logs.removeChild(logs.firstChild);
            }
        }
        
        function updateStats(message, type = 'normal') {
            const className = type === 'good' ? 'good' : type === 'warning' ? 'warning' : type === 'error' ? 'error' : '';
            stats.innerHTML = `<div class="${className}">${message}</div>`;
        }
        
        function loadStream(url) {
            if (!url) {
                log('Please enter a URL', 'error');
                return;
            }
            
            log(`Loading stream: ${url}`, 'info');
            
            if (hls) {
                hls.destroy();
                log('Previous HLS instance destroyed', 'info');
            }
            
            bufferCount = 0;
            updateStats('Loading stream...', 'warning');
            loadBtn.disabled = true;
            loadBtn.textContent = 'Loading...';
            
            if (Hls.isSupported()) {
                log('HLS.js is supported, creating instance', 'success');
                hls = new Hls({
                    debug: false,
                    enableWorker: true,
                    lowLatencyMode: true,
                    backBufferLength: 90,
                    maxBufferLength: 30,
                    maxMaxBufferLength: 60,
                    maxFragLookUpTolerance: 0.25,
                    liveSyncDurationCount: 3,
                    liveMaxLatencyDurationCount: Infinity,
                    preferManagedMediaSource: true
                });
                
                hls.loadSource(url);
                hls.attachMedia(video);
                
                hls.on(Hls.Events.MEDIA_ATTACHED, function() {
                    log('Media attached to HLS instance', 'success');
                });
                
                hls.on(Hls.Events.MANIFEST_PARSED, function(event, data) {
                    log(`Manifest parsed! Found ${data.levels.length} quality levels`, 'success');
                    updateStats('Stream loaded! Press play to start.', 'good');
                    loadBtn.disabled = false;
                    loadBtn.textContent = 'Reload';
                    
                    video.muted = true;
                    video.play().then(() => {
                        log('Autoplay started', 'success');
                    }).catch(e => {
                        log('Autoplay failed, user interaction required', 'warning');
                        updateStats('Click play to start streaming', 'warning');
                    });
                });
                
                hls.on(Hls.Events.ERROR, function(event, data) {
                    if (data.fatal) {
                        switch(data.type) {
                            case Hls.ErrorTypes.NETWORK_ERROR:
                                log(`Network error: ${data.details}`, 'error');
                                updateStats('Network error, retrying...', 'warning');
                                hls.startLoad();
                                break;
                            case Hls.ErrorTypes.MEDIA_ERROR:
                                log(`Media error: ${data.details}`, 'error');
                                updateStats('Media error, recovering...', 'warning');
                                hls.recoverMediaError();
                                break;
                            default:
                                log(`Fatal error: ${data.details} (${data.type})`, 'error');
                                updateStats('Fatal error: ' + data.details, 'error');
                                loadBtn.disabled = false;
                                loadBtn.textContent = 'Load Stream';
                                break;
                        }
                    } else {
                        log(`Non-fatal error: ${data.details}`, 'warning');
                    }
                });
                
                hls.on(Hls.Events.FRAG_BUFFERED, function(event, data) {
                    bufferCount++;
                    const latency = hls.latency ? Math.round(hls.latency) + 's' : 'N/A';
                    const position = Math.round(video.currentTime);
                    const buffer = Math.round(hls.buffered.length ? hls.buffered.end(0) - video.currentTime : 0);
                    
                    updateStats(`
                        Segments buffered: ${bufferCount}<br>
                        Live latency: ${latency}<br>
                        Position: ${position}s<br>
                        Buffer: ${buffer}s<br>
                        Dropped frames: ${video.getVideoPlaybackQuality?.()?.droppedVideoFrames || 0}
                    `, 'good');
                });
                
                hls.on(Hls.Events.LEVEL_SWITCHED, function(event, data) {
                    log(`Switched to quality level: ${data.level} (${hls.levels[data.level].height}p)`, 'info');
                });
                
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                log('Using native HLS player (Safari/iOS)', 'info');
                video.src = url;
                updateStats('Using native HLS player', 'good');
                loadBtn.disabled = false;
                loadBtn.textContent = 'Reload';
            } else {
                log('HLS not supported in this browser', 'error');
                updateStats('HLS not supported in this browser', 'error');
                loadBtn.disabled = false;
                loadBtn.textContent = 'Load Stream';
            }
        }
        
        function loadPreset(url) {
            streamUrl.value = url;
            loadStream(url);
        }
        
        // Event listeners
        loadBtn.addEventListener('click', () => {
            loadStream(streamUrl.value.trim());
        });
        
        muteBtn.addEventListener('click', () => {
            video.muted = !video.muted;
            muteBtn.textContent = video.muted ? 'Unmute' : 'Mute';
            muteBtn.classList.toggle('active', video.muted);
            log(video.muted ? 'Audio muted' : 'Audio unmuted', 'info');
        });
        
        fullscreenBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                video.requestFullscreen().then(() => {
                    log('Entered fullscreen mode', 'info');
                }).catch(e => {
                    log(`Failed to enter fullscreen: ${e.message}`, 'error');
                });
            } else {
                document.exitFullscreen().then(() => {
                    log('Exited fullscreen mode', 'info');
                });
            }
        });
        
        clearLogsBtn.addEventListener('click', () => {
            logs.innerHTML = '<div class="log-line log-info">Logs cleared</div>';
        });
        
        video.addEventListener('play', () => {
            isPlaying = true;
            loadBtn.textContent = 'Reload';
            log('Playback started', 'success');
        });
        
        video.addEventListener('pause', () => {
            isPlaying = false;
            log('Playback paused', 'info');
        });
        
        video.addEventListener('ended', () => {
            log('Playback ended', 'info');
        });
        
        video.addEventListener('waiting', () => {
            log('Buffering...', 'warning');
        });
        
        video.addEventListener('canplay', () => {
            log('Can play', 'success');
        });
        
        // Allow Enter key to load
        streamUrl.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                loadStream(streamUrl.value.trim());
            }
        });
        
        // Auto-load initial URL
        window.addEventListener('load', () => {
            log('Page loaded, ready to test streams', 'success');
        });
    </script>
</body>
</html>
