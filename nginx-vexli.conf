server {
    listen 443 ssl;
    server_name vexli.online www.vexli.online;

    # ── Node.js backend (frontend + auth + sports + legacy) ──────────────
    location / {
        proxy_pass http://127.0.0.1:24608;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ── Rust backend API ─────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:24609;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;
    }

    # ── SSE streams (under /api/streams/) — disable buffering ─────────────
    location /api/streams/ {
        proxy_pass http://127.0.0.1:24609;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # ── Rust proxy routes (HLS, TS, subtitles) ───────────────────────────
    location ~ ^/(m3u8-proxy|ts-proxy|sub-proxy) {
        proxy_pass http://127.0.0.1:24609;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # ── Storage / encryption keys (proxied through Rust) ─────────────────
    location /storage/ {
        proxy_pass http://127.0.0.1:24609;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Scraper microservice (if you still need it) ────────────────────
    location /scrape/ {
        proxy_pass http://127.0.0.1:24610/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
    }

    ssl_certificate /etc/letsencrypt/live/vexli.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vexli.online/privkey.pem;
}

server {
    listen 80;
    server_name vexli.online www.vexli.online;
    return 301 https://$host$request_uri;
}
