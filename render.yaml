services:
  type: web
  name: hue-api
  env: docker
  repo: https://github.com/roywalk3r/hue.git
  dockerfilePath: ./Dockerfile
  dockerContext: .
  plan: free
  healthCheckPath: /api/health
  envVars:
    - key: NODE_ENV
      value: production
    - key: API_PORT
      value: 8787
  disk:
    name: hue-data
    mountPath: /app/data
    sizeGB: 1
