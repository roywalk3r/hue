[package]
name = "huerust"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async Runtime & Web Framework
tokio = { version = "1.36", features = ["full"] }
axum = { version = "0.7.4", features = ["macros"] }
tower-http = { version = "0.5.2", features = ["cors", "compression-gzip", "compression-br", "trace"] }

# Networking & Scraped Data
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls", "multipart", "gzip", "brotli", "zstd", "deflate"] }
reqwest-middleware = { version = "0.3", features = ["json"] }
reqwest-retry = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_qs = "0.13"
url = "2.5"
urlencoding = "2.1"
base64 = "0.21"
hex = "0.4"

# Security
aes = "0.8"
aes-gcm = "0.10"
cbc = { version = "0.1", features = ["alloc"] }
cipher = { version = "0.4", features = ["alloc"] }
scrypt = { version = "0.11", default-features = false, features = ["simple"] }
sha2 = "0.10"
hmac = "0.12"

# Logging & Utilities
tracing = "0.1"
tracing-subscriber = "0.3"
chrono = { version = "0.4", features = ["serde"] }
dotenv = "0.15"
rand = "0.8"
anyhow = "1.0"
thiserror = "1.0"
validator = { version = "0.18", features = ["derive"] }

# Caching & Concurrency
moka = { version = "0.12", features = ["future"] }
dashmap = "6.0"
redis = { version = "0.24", features = ["tokio-comp"] }
deadpool-redis = "0.15"
governor = "0.6"
ulid = "1.1"

# Provider Trait
async-trait = "0.1"

# Streaming (SSE)
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"

# Rate Limiting
tower = { version = "0.4", features = ["limit"] }

# Metrics
metrics = "0.23"
metrics-exporter-prometheus = "0.15"

# Scraping
regex = "1.10"

# TLS
rustls-pemfile = "2.0"
webpki-roots = "0.26"
flate2 = "1.0"
brotli = "6.0"
zstd = "0.13"

# Documentation (OpenAPI)
utoipa = { version = "4", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "6", features = ["axum"] }
