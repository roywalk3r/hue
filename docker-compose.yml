services:
  tmdb-embed-api:
    build: .
    container_name: tmdb-embed-api
    environment:
      # Provide at least one TMDB key (comma separated or override via UI later)
      - TMDB_API_KEY=${TMDB_API_KEY:-}
      # Alternative: supply JSON array
      # - TMDB_API_KEYS=["key1","key2"]
      - API_PORT=24608
      - BIND_HOST=0.0.0.0
      - USER_CONFIG_PATH=/app/data/user-config.json
      # FebBox cookies (comma separated) if you want Showbox immediately functional
      - FEBBOX_COOKIES=${FEBBOX_COOKIES:-}
    ports:
      - "24608:24608"
    volumes:
      # Persist runtime overrides in a dedicated Docker volume.
      - user_config_data:/app/data
      # Allow restart trigger file (optional; stored in container FS)
      # - restart_marker:/app/restart.trigger
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + (process.env.API_PORT || 24608) + '/api/health').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
volumes:
  user_config_data:
