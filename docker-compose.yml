version: "3.9"

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  rust-api:
    build:
      context: ./huerust
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "0.0.0.0:24609:24609"
    environment:
      - RUST_HOST=0.0.0.0
      - RUST_PORT=24609
      - REDIS_URL=redis://redis:6379
      - SCRAPER_URL=http://node-scraper:24610
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      node-scraper:
        condition: service_healthy

  node-scraper:
    build:
      context: ./node-scraper
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:24610:24610"
    environment:
      - SCRAPER_PORT=24610
      - REDIS_URL=redis://redis:6379
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis_data:
